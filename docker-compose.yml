version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
    ports:
      - "3004:80"
    env_file:
      - .env
    restart: unless-stopped

  frontend_new:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
        VITE_GOOGLE_MAP_API_KEY: ${VITE_GOOGLE_MAP_API_KEY}
        VITE_GOOGLE_MAP_ID: ${VITE_GOOGLE_MAP_ID}
    ports:
      - "3006:80"
    env_file:
      - .env
    restart: unless-stopped